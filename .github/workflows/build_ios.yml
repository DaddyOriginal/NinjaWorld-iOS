name: Build Ninja World iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Download and Setup Cocos2d-x 2.2.6 Engine & Dependencies
        run: |
          echo "Downloading official Cocos2d-x 2.2.6 release..."
          curl -L -s https://github.com/cocos2d/cocos2d-x/archive/refs/tags/cocos2d-x-2.2.6.tar.gz | tar -xz
          mv cocos2d-x-cocos2d-x-2.2.6 cocos2d-x

          echo "Downloading Cocos2d-x prebuilt third-party dependencies (v2-deps-4)..."
          curl -L -s https://github.com/cocos2d/cocos2d-x-3rd-party-libs-bin/archive/refs/tags/v2-deps-4.tar.gz | tar -xz
          cp -R cocos2d-x-3rd-party-libs-bin-v2-deps-4/* cocos2d-x/
          rm -rf cocos2d-x-3rd-party-libs-bin-v2-deps-4
          
          # Fix loi thieu decode.h / webp stub
          cat << 'EOF' > cocos2d-x/cocos2dx/platform/CCImageCommonWebp.cpp
          #include "platform/CCImage.h"
          NS_CC_BEGIN
          bool CCImage::_initWithWebpData(void *pData, int nDataLen) {
              return false;
          }
          NS_CC_END
          EOF
          
          echo "Setting up NinjaWorld from official multi-platform-cpp template..."
          mkdir -p cocos2d-x/projects/NinjaWorld
          cp -R cocos2d-x/template/multi-platform-cpp/* cocos2d-x/projects/NinjaWorld/
          
          # Rename template to NinjaWorld
          cd cocos2d-x/projects/NinjaWorld
          mv proj.ios/HelloCpp.xcodeproj proj.ios/NinjaWorld.xcodeproj
          find . -type f \( -name "*.pbxproj" -o -name "*.plist" -o -name "*.pch" \) -exec sed -i '' 's/HelloCpp/NinjaWorld/g' {} +
          find . -type f \( -name "*.pbxproj" -o -name "*.plist" -o -name "*.pch" \) -exec sed -i '' 's/org.cocos2dx.hellocpp/com.ninja.world/g' {} +
          
          # Copy our Classes and genuine Resources into the project
          cp -R "$GITHUB_WORKSPACE/Classes/"* Classes/
          cp -R "$GITHUB_WORKSPACE/Resources/"* Resources/

      - name: 3. Build NinjaWorld with xcodebuild
        run: |
          cd cocos2d-x/projects/NinjaWorld/proj.ios
          
          set -o pipefail
          xcodebuild -project NinjaWorld.xcodeproj \
            -scheme NinjaWorld \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            VALID_ARCHS="arm64" \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            OTHER_CFLAGS="-Wno-error -Wno-c++11-narrowing -Wno-deprecated-declarations" \
            OTHER_CPLUSPLUSFLAGS="-Wno-error -Wno-c++11-narrowing -Wno-deprecated-declarations" \
            OTHER_LDFLAGS="-Wl,-ld_classic -framework Security -framework SystemConfiguration -framework CFNetwork -lz -lxml2" \
            build 2>&1 | tee /tmp/xcodebuild.log

      - name: Inspect Build Log on Failure
        if: failure()
        run: |
          echo "=== LAST 150 LINES OF BUILD LOG ==="
          tail -n 150 /tmp/xcodebuild.log || true
          echo "=== ALL ERRORS FOUND ==="
          grep -E "error:|FAILED|Undefined symbol" /tmp/xcodebuild.log | tail -n 50 || true

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xcode-Build-Log
          path: /tmp/xcodebuild.log
          if-no-files-found: ignore

      - name: 4. Package into .ipa for Sideloadly
        run: |
          mkdir -p Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "NinjaWorld.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find cocos2d-x/projects/NinjaWorld/proj.ios -name "*.app" -type d | head -n 1)
          fi
          echo "Found compiled app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: App bundle not found!"
            exit 1
          fi
          cp -R "$APP_PATH" Payload/
          zip -r -9 NinjaWorld.ipa Payload
          ls -lh NinjaWorld.ipa

      - name: 5. Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NinjaWorld-iOS-IPA
          path: NinjaWorld.ipa
          retention-days: 14
