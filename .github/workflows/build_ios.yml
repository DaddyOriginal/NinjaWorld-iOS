name: Build Ninja World iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Download and Setup Cocos2d-x 2.2.6 Engine
        run: |
          echo "Downloading official Cocos2d-x 2.2.6 release..."
          curl -L -s https://github.com/cocos2d/cocos2d-x/archive/refs/tags/cocos2d-x-2.2.6.tar.gz | tar -xz
          mv cocos2d-x-cocos2d-x-2.2.6 cocos2d-x
          
          echo "Setting up NinjaWorld from official multi-platform-cpp template..."
          mkdir -p cocos2d-x/projects/NinjaWorld
          cp -R cocos2d-x/template/multi-platform-cpp/* cocos2d-x/projects/NinjaWorld/
          
          # Rename template to NinjaWorld
          cd cocos2d-x/projects/NinjaWorld
          mv proj.ios/HelloCpp.xcodeproj proj.ios/NinjaWorld.xcodeproj
          find . -type f \( -name "*.pbxproj" -o -name "*.plist" -o -name "*.pch" \) -exec sed -i '' 's/HelloCpp/NinjaWorld/g' {} +
          find . -type f \( -name "*.pbxproj" -o -name "*.plist" -o -name "*.pch" \) -exec sed -i '' 's/org.cocos2dx.hellocpp/com.ninja.world/g' {} +
          
          # Copy our Classes and genuine Resources into the project
          cp -R "$GITHUB_WORKSPACE/Classes/"* Classes/
          cp -R "$GITHUB_WORKSPACE/Resources/"* Resources/

      - name: 3. Build NinjaWorld with xcodebuild
        run: |
          cd cocos2d-x/projects/NinjaWorld/proj.ios
          
          xcodebuild -project NinjaWorld.xcodeproj \
            -scheme NinjaWorld \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            OTHER_CFLAGS="-Wno-error -Wno-c++11-narrowing -Wno-deprecated-declarations" \
            OTHER_CPLUSPLUSFLAGS="-Wno-error -Wno-c++11-narrowing -Wno-deprecated-declarations" \
            build

      - name: 4. Package into .ipa for Sideloadly
        run: |
          mkdir -p Payload
          APP_PATH=$(find cocos2d-x/projects/NinjaWorld/proj.ios/build -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "NinjaWorld.app" -type d | head -n 1)
          fi
          echo "Found compiled app at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r -9 NinjaWorld.ipa Payload
          ls -lh NinjaWorld.ipa

      - name: 5. Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NinjaWorld-iOS-IPA
          path: NinjaWorld.ipa
          retention-days: 14
